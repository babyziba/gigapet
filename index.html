<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Pixel Pichu GigaPet</h1>
      <p>Keep your tiny pixel buddy happy, healthy, and full of energy!</p>
    </header>

    <main class="app-main">
      <!-- Pet + message panel -->
      <section class="pet-panel">
        <div class="pet-image-wrapper">
          <!-- use your local happy.png -->
          <img
            class="pet-image"
            src="happy.png"
            alt="Happy pixel pet"
          />
        </div>

        <!-- Visual notification after every button press -->
        <div id="pet-message" class="pet-message" aria-live="polite"></div>
      </section>

      <!-- Stats + controls panel -->
      <section class="dashboard">
        <div class="stat-line">
          Name:
          <strong><span class="name"></span></strong>
        </div>
        <div class="stat-line">
          Weight:
          <strong><span class="weight"></span> lbs</strong>
        </div>
        <div class="stat-line">
          Happiness:
          <strong><span class="happiness"></span> tail wags / min</strong>
        </div>
        <!-- NEW behavior/stat shown under happiness -->
        <div class="stat-line">
          Energy:
          <strong><span class="energy"></span>/10</strong>
        </div>
        <div class="stat-line mood-line">
          Mood:
          <strong><span class="mood"></span></strong>
        </div>

        <div class="button-container">
          <button class="action-button treat-button">Treat</button>
          <button class="action-button play-button">Play</button>
          <button class="action-button exercise-button">Exercise</button>
          <!-- NEW action button -->
          <button class="action-button nap-button">Nap</button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>COMP 484 – GigaPet Project</p>
    </footer>

    <!-- jQuery library (required by the project spec) -->
    <script
      src="https://code.jquery.com/jquery-2.2.1.min.js"
      integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
      crossorigin="anonymous"
    ></script>

    <!-- Your game logic -->
    <script src="script.js"></script>
  </body>
</html>
